name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # super_clipboard's build hook compiles Rust, which links GTK on Linux.
      # The .deb files are cached per runner image: the Ubuntu mirror
      # sometimes takes minutes to send them.
      - id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Linux build packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ steps.image.outputs.key }}-gtk3
          restore-keys: apt-${{ steps.image.outputs.os }}-
      - name: Install Linux build libraries
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-cache" \
            pkg-config libgtk-3-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      # The hook downloads the crate's pinned Rust toolchain, with every
      # target in its rust-toolchain.toml, and compiles the crate. Keep both.
      - name: Cache Rust toolchain and build hook output
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
            ~/.rustup/update-hashes
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .dart_tool/hooks_runner
          key: hooks-test-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-test-${{ runner.os }}-
      - run: flutter test
      # After the tests, so a formatting slip doesn't hide their results.
      - run: dart format --output=none --set-exit-if-changed lib test

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
