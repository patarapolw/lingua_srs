name: Desktop

# Builds the macOS and Linux apps and runs integration_test/ on them, to check
# the OS keychain and the macOS sandbox entitlements on real builds. Unit tests
# in ci.yml cannot reach either. Free on a public repository; runs only when
# platform code changes, to keep it cheap if the repository becomes private
# (macOS minutes count ten times).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop.yml
      - integration_test/**
      - lib/services/secret_storage.dart
      - linux/**
      - macos/**
      - pubspec.yaml
      - pubspec.lock
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - integration_test/**
      - lib/services/secret_storage.dart
      - linux/**
      - macos/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Build tools and the libraries the plugins link against (GTK,
      # libsecret, WebKitGTK, GStreamer), plus a keyring, a D-Bus session and
      # a virtual display to run the app in. The .deb files are cached per
      # runner image: the Ubuntu mirror sometimes takes minutes to send them.
      - id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Linux build packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ steps.image.outputs.key }}-desktop
          restore-keys: apt-${{ steps.image.outputs.os }}-
      - name: Install Linux build and test dependencies
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-cache" \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gnome-keyring dbus-x11 xvfb
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - run: flutter pub get
      # super_clipboard's build hook downloads the crate's pinned Rust
      # toolchain and compiles the crate. Keep both.
      - name: Cache Rust toolchain and build hook output
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
            ~/.rustup/update-hashes
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .dart_tool/hooks_runner
          key: hooks-linux-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-linux-${{ runner.os }}-
      - run: flutter build linux --debug
      - name: Run integration tests with an unlocked keyring
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets
            flutter test integration_test -d linux
          '

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Cache Rust toolchain and build hook output
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
            ~/.rustup/update-hashes
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .dart_tool/hooks_runner
          key: hooks-macos-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-macos-${{ runner.os }}-
      - run: flutter build macos --debug
      - run: flutter test integration_test -d macos
